name: iOS Build and Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Portable core tests
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build and test on iPhone simulator
        run: |
          set -euo pipefail
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone 16 Pro")))')
          xcodebuild -project PerfectTiming.xcodeproj -scheme PerfectTiming -configuration Debug -destination "platform=iOS Simulator,id=$DESTINATION" -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO clean build test
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-timing-xcresults
          path: .build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
