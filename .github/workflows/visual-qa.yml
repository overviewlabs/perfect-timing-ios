name: Visual QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build and capture
        shell: bash
        run: |
          set -euo pipefail
          udid="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          devices = [device for runtime in data["devices"].values() for device in runtime]
          preferred = next((device for device in devices if device["name"] == "iPhone 16 Pro"), None)
          selected = preferred or next(device for device in devices if device["name"].startswith("iPhone"))
          print(selected["udid"])
          PY
          )"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild \
            -project PerfectTiming.xcodeproj \
            -scheme PerfectTiming \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(python3 - <<'PY'
          from pathlib import Path
          import os
          products = Path(os.environ["RUNNER_TEMP"]) / "DerivedData/Build/Products/Debug-iphonesimulator"
          print(next(products.glob("*.app")))
          PY
          )"
          xcrun simctl install "$udid" "$app_path"
          mkdir -p screenshots
          for appearance in light dark; do
            xcrun simctl ui "$udid" appearance "$appearance"
            xcrun simctl launch --terminate-running-process "$udid" com.whox.perfecttiming -uiTestOnboarded
            sleep 3
            xcrun simctl io "$udid" screenshot "screenshots/home-$appearance.png"
          done
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dont-tap-yet-visual-qa
          path: screenshots/*.png
          if-no-files-found: error
