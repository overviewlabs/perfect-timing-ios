name: PerfectTiming
options:
  bundleIdPrefix: com.whox
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: "" # TODO: Set Apple Developer team.
targets:
  PerfectTimingCore:
    type: framework
    platform: iOS
    sources: [Sources/PerfectTimingCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whox.perfecttiming.core
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
  PerfectTiming:
    type: application
    platform: iOS
    sources:
      - PerfectTiming/App
      - PerfectTiming/Game
      - PerfectTiming/Models
      - PerfectTiming/Services
      - PerfectTiming/Views
    resources:
      - PerfectTiming/Resources
    dependencies:
      - target: PerfectTimingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whox.perfecttiming
        PRODUCT_NAME: Perfect Timing
        INFOPLIST_FILE: PerfectTiming/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PerfectTiming/Resources/PerfectTiming.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Dont Tap Yet App Store
    scheme:
      testTargets: [PerfectTimingTests, PerfectTimingUITests]
      storeKitConfiguration: PerfectTiming/Resources/PerfectTiming.storekit
  PerfectTimingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PerfectTimingCoreTests]
    dependencies: [{target: PerfectTimingCore}]
  PerfectTimingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/PerfectTimingUITests]
    dependencies: [{target: PerfectTiming}]
